[package]
name = "in-line"
version = "0.5.0"
description = "In Line - a general-purpose task queue"
authors = ["bluntvoice"]
edition = "2021"
license = "GPL-3.0-only"
default-run = "in-line"
[lib]
name = "in_line_lib"
crate-type = ["rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
rmcp = { version = "3.1.2", features = ["transport-io", "client", "transport-child-process"] }
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
getrandom = "0.3"
hmac = "0.12"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "=2.3.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
toml_edit = "=0.25.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
# Native Windows API bindings already present transitively; no font database dependency.
windows = { version = "0.61", features = ["Win32_Graphics_DirectWrite"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client", "transport-child-process"] }
