[package]
name = "in-line"
version = "0.2.2"
description = "In Line - a general-purpose task queue"
authors = ["bluntvoice"]
edition = "2021"
license = "GPL-3.0-only"
default-run = "in-line"
[lib]
name = "in_line_lib"
crate-type = ["rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "=2.3.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client", "transport-child-process"] }
