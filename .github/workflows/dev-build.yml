name: Development Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 development artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check GitHub Actions runtime policy
        shell: pwsh
        run: ./scripts/check-github-actions-runtime.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        run: npm run dist

      - name: Verify packaged MCP sidecar contracts and authorization
        shell: pwsh
        run: |
          node scripts/verify-mcp-contract.mjs src-tauri/target/release/in-line-mcp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node docs/mcp/verify-release-stdio.mjs src-tauri/target/release/in-line-mcp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-mcp-contract.mjs src-tauri/binaries/in-line-mcp-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node docs/mcp/verify-release-stdio.mjs src-tauri/binaries/in-line-mcp-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CLI companions and actual NSIS payload
        shell: pwsh
        run: |
          node scripts/verify-cli-package.mjs src-tauri/target/release --expected-commit $env:GITHUB_SHA --companions src-tauri/binaries --target x86_64-pc-windows-msvc --output release/package-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one development installer' }
          ./scripts/verify-installer-package.ps1 -InstallerPath $installers[0].FullName -BinaryDirectory src-tauri/target/release -ExpectedCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload development installer
        uses: actions/upload-artifact@v7
        with:
          name: In-Line-dev-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/package-build.json
            release/installer-payload.json
            release/installer-verification.json
          if-no-files-found: error
          retention-days: 14
