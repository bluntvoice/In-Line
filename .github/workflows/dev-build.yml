name: Development Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 development artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check GitHub Actions runtime policy
        shell: pwsh
        run: ./scripts/check-github-actions-runtime.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        run: npm run dist

      - name: Upload development installer
        uses: actions/upload-artifact@v6
        with:
          name: In-Line-dev-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
